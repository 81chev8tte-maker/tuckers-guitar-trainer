name: Apply v2.6.7 Guided Hardware Acceptance

on:
  push:
    branches:
      - feature/guided-hardware-acceptance-v2.6.7

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guided-hardware-acceptance-v2.6.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused release patch
        run: python .github/scripts/apply_v267.py
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic tests
        run: npm test
      - name: Run syntax checks
        run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run test:browser
      - name: Check patch hygiene
        run: git diff --check
      - name: Commit validated release implementation
        run: |
          rm .github/workflows/apply-v267.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: guided hardware acceptance test v2.6.7"
          git push origin HEAD:feature/guided-hardware-acceptance-v2.6.7
