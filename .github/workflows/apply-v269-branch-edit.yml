name: Temporary v2.6.9 branch edit

on:
  push:
    branches:
      - fix/23-piano-falling-note-readability

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/23-piano-falling-note-readability
      - name: Normalize focused Guitar selector isolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          styles = Path('styles.css')
          text = styles.read_text()
          target = '.falling-note{background:var(--string-color)!important;border:2px solid rgba(255,255,255,.95)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--string-color) 78%,#000 22%),0 5px 14px rgba(0,0,0,.34)!important}'
          scoped = '#noteLayer ' + target

          # Normalize any duplicate prefix introduced by overlapping temporary branch runs.
          while '#noteLayer #noteLayer ' + target in text:
              text = text.replace('#noteLayer #noteLayer ' + target, scoped, 1)

          # Scope the original bare v2.6.4 Guitar rule only when it begins a CSS line.
          bare = '\n' + target
          if bare in text:
              text = text.replace(bare, '\n' + scoped, 1)

          if scoped not in text:
              raise SystemExit('Expected scoped v2.6.4 Guitar falling-note rule was not found')
          styles.write_text(text)
          PY
      - name: Commit normalization if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize Guitar falling-note selector scope"
          git push origin HEAD:fix/23-piano-falling-note-readability
