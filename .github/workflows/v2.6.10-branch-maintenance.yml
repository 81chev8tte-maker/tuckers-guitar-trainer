name: v2.6.10 branch maintenance

on:
  push:
    branches:
      - "fix/v2.6.10-startup-home-player-safety"

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.6.10-startup-home-player-safety
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused v2.6.10 edits
        shell: bash
        run: |
          git show origin/main:profiles.js > profiles.js
          git show origin/main:piano.js > piano.js
          node <<'NODE'
          const fs = require('fs');
          const startupTestB64 = '';
          const changelogEntryB64 = '';
          function read(file) { return fs.readFileSync(file, 'utf8'); }
          function write(file, text) { fs.writeFileSync(file, text); }
          function replaceOnce(text, from, to, label) {
            const first = text.indexOf(from);
            if (first < 0) throw new Error(`Missing expected text for ${label}`);
            if (text.indexOf(from, first + from.length) >= 0) throw new Error(`Expected one match for ${label}`);
            return text.slice(0, first) + to + text.slice(first + from.length);
          }
          function replaceAllVersion(file) {
            const before = read(file);
            if (!before.includes('2.6.9')) throw new Error(`${file} has no v2.6.9 reference to advance`);
            write(file, before.replaceAll('2.6.9', '2.6.10'));
          }

          let profiles = read('profiles.js');
          profiles = replaceOnce(profiles, "  function init() {\n    $('#profileMenuButton').addEventListener('click', openManager);\n    updateIdentity();\n    if (!activeProfile()) showFirstRun(1);\n  }", "  function init() {\n    $('#profileMenuButton').addEventListener('click', openManager);\n    if (activeProfile()) showHome();\n    else showFirstRun(1);\n  }", 'profile startup home');
          write('profiles.js', profiles);

          let piano = read('piano.js');
          piano = replaceOnce(piano, "  const remembered=localStorage.getItem(INSTRUMENT_KEY);\n  if(window.FMQProfiles?.hasActiveProfile()){if(remembered)chooseInstrument(remembered);else showChooser();}", "  if(window.FMQProfiles?.hasActiveProfile())showChooser();", 'instrument auto resume');
          write('piano.js', piano);

          let app = read('app.js');
          app = replaceOnce(app, "const APP_VERSION = '2.6.9';", "const APP_VERSION = '2.6.10';", 'app version');
          app = replaceOnce(app, "window.addEventListener('family-music:profile-changing', stopForProfileChange);\n  window.addEventListener('family-music:profile-changed', reloadActiveProfile);", "window.addEventListener('family-music:profile-changing', stopForProfileChange);\n  window.addEventListener('family-music:show-home', stopForProfileChange);\n  window.addEventListener('family-music:profile-changed', reloadActiveProfile);", 'home cleanup listener');
          app = replaceOnce(app, "navigator.serviceWorker.register('./sw.js?v=2.6.9')", "navigator.serviceWorker.register('./sw.js?v=2.6.10')", 'service worker registration');
          write('app.js', app);

          for (const file of ['index.html','sw.js','pwa-assets.test.js','guided-hardware-acceptance.js','guided-hardware-acceptance.test.js','package.json','package-lock.json']) replaceAllVersion(file);

          let smoke = read('browser-tests/app-smoke.spec.js');
          smoke = replaceOnce(smoke, "  await page.reload();\n  await expect(page.getByText('Ready, Browser Test?')).toBeVisible();", "  await page.reload();\n  await expect(page.getByRole('heading',{name:'What are we playing today?'})).toBeVisible();\n  await expect(page.locator('#instrumentChooser [data-player-name]').first()).toHaveText('Browser Test');\n  await expect(page.locator('#pianoApp')).toBeHidden();\n  await expect(page.locator('body')).not.toHaveClass(/piano-active/);", 'app smoke reload expectation');
          smoke = smoke.replaceAll("expect(report.appVersion).toBe('2.6.9');", "expect(report.appVersion).toBe('2.6.10');");
          write('browser-tests/app-smoke.spec.js', smoke);

          write('browser-tests/startup-navigation.spec.js', Buffer.from(startupTestB64, 'base64').toString('utf8'));

          let changelog = read('CHANGELOG.md');
          const heading = '# Changelog\n\n';
          if (!changelog.startsWith(heading)) throw new Error('Unexpected CHANGELOG heading');
          const entry = Buffer.from(changelogEntryB64, 'base64').toString('utf8');
          if (!changelog.includes('## v2.6.10 — Startup Home & Player Safety Fix')) changelog = heading + entry + changelog.slice(heading.length);
          write('CHANGELOG.md', changelog);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Unit and deterministic tests
        run: npm test

      - name: Syntax checks
        run: npm run check

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser

      - name: Verify version alignment and focused diff
        shell: bash
        run: |
          node -e "const fs=require('fs'); for(const f of ['package.json','package-lock.json','index.html','sw.js','app.js','pwa-assets.test.js','guided-hardware-acceptance.js','guided-hardware-acceptance.test.js']) if(fs.readFileSync(f,'utf8').includes('2.6.9')) throw new Error(f+' still has v2.6.9'); if(require('./package.json').version!=='2.6.10') throw new Error('package version mismatch')"
          git diff --check
          git status --short

      - name: Commit validated release edits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profiles.js piano.js app.js browser-tests/app-smoke.spec.js browser-tests/startup-navigation.spec.js CHANGELOG.md guided-hardware-acceptance.js guided-hardware-acceptance.test.js index.html package.json package-lock.json pwa-assets.test.js sw.js
          git commit -m "v2.6.10 — Startup Home & Player Safety Fix"
          git push origin HEAD:fix/v2.6.10-startup-home-player-safety
