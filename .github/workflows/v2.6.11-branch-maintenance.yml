name: v2.6.11 branch maintenance

on:
  push:
    branches:
      - fix/v2.6.11-piano-microphone-reliability
    paths:
      - .github/workflows/v2.6.11-branch-maintenance.yml

permissions:
  contents: write

jobs:
  implement:
    if: "github.event.head_commit.message == 'chore: trigger v2.6.11 maintenance validation'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.6.11-piano-microphone-reliability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused implementation
        run: python3 .github/scripts/v2.6.11-maintenance.py
      - name: Check diff whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic tests
        run: npm test
      - name: Run syntax checks
        run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:browser
      - name: Verify focused version alignment and scope guard
        run: |
          python3 -c "import json; from pathlib import Path; assert json.loads(Path('package.json').read_text())['version']=='2.6.11'; assert 'family-music-quest-v2.6.11' in Path('sw.js').read_text(); assert './piano.js?v=2.6.11' in Path('index.html').read_text(); assert \"const APP_VERSION = '2.6.11'\" in Path('app.js').read_text(); assert \"const APP_VERSION = '2.6.11'\" in Path('guided-hardware-acceptance.js').read_text(); assert 'WakeLock' not in Path('piano.js').read_text()"
      - name: Commit implementation
        run: |
          git config user.name "81chev8tte-maker"
          git config user.email "81chev8tte@gmail.com"
          git add piano.js browser-tests/piano-microphone-reliability.spec.js package.json package-lock.json index.html sw.js app.js guided-hardware-acceptance.js pwa-assets.test.js guided-hardware-acceptance.test.js browser-tests/app-smoke.spec.js ARCHITECTURE.md TESTING.md ROADMAP.md CHANGELOG.md
          git commit -m "fix: make Piano microphone practice reliable"
          git push origin HEAD:fix/v2.6.11-piano-microphone-reliability
