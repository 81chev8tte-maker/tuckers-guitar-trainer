          new_toggle="    async toggleMic(){if(this.mode==='listen'||!this.microphoneCompatible){this.inputNotice='Mic is for single-note practice';this.renderInputState();this.feedback('Use screen keys or USB MIDI for this part');return;}if(microphoneInput.active){microphoneInput.stop();setPianoInputIntent('screen');$('pianoGameMic').textContent='🎙 Mic';this.inputNotice='';this.renderInputState();return;}this.renderInputState('Input: microphone · connecting…');try{await microphoneInput.start(r=>{if(r.name&&$('pianoInputPill'))$('pianoInputPill').textContent=`Heard: ${r.name}${r.stable?' ✓':''}`;});$('pianoGameMic').textContent='🎙 On';this.inputNotice='';this.renderInputState();}catch(err){setPianoInputIntent('screen');$('pianoGameMic').textContent='🎙 Mic';this.inputNotice='microphone unavailable';this.renderInputState();this.feedback('Microphone unavailable — using screen keys');}}"
          s=replace_once(s,old_toggle,new_toggle,'game mic toggle')

