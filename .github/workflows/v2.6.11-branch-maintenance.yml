          input_methods=r'''    inputStateLabel(){
      if(this.mode==='listen')return 'no input needed';
      if(this.midiInput.unsubscribe)return 'USB MIDI';
      if(getPianoInputIntent()==='microphone'&&microphoneInput.active)return 'microphone';
