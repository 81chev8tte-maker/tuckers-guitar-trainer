          'Piano test hooks')

          path.write_text(s)

          # Release/version alignment.
          for name in ['package.json','package-lock.json','index.html','sw.js','app.js','guided-hardware-acceptance.js','pwa-assets.test.js','guided-hardware-acceptance.test.js','browser-tests/app-smoke.spec.js']:
              p=Path(name);text=p.read_text();
              if '2.6.10' not in text: raise SystemExit(f'{name}: expected v2.6.10 reference before bump')
              p.write_text(text.replace('2.6.10','2.6.11'))

          # Architecture: record the small input-lifecycle/detector behavior change.
          p=Path('ARCHITECTURE.md');text=p.read_text()
          old="### Microphone\n\nPiano microphone detection uses a larger 4,096-sample analyser buffer and main-thread autocorrelation with confidence/stability/debounce logic. It is intentionally treated as monophonic.\n"
          new="### Microphone\n\nPiano microphone detection uses a larger 4,096-sample analyser buffer and main-thread autocorrelation with confidence/stability/debounce logic. It is intentionally treated as monophonic. The production thresholds remain conservative; candidate-pitch history is reset when a clean rounded pitch changes or the signal becomes invalid so stale readings from the previous note do not unnecessarily delay the next stable note.\n\nA successful Piano microphone test/selection establishes a session-scoped microphone intent. Actual capture is still released on Mic Test/game/navigation cleanup boundaries; compatible scored single-note practice reacquires the microphone before count-in/restart and shows the active input explicitly. This intent is not a profile/save-schema field and Listen First/polyphonic material does not auto-start microphone capture.\n"
          if old not in text: raise SystemExit('ARCHITECTURE microphone paragraph not found')
          p.write_text(text.replace(old,new,1))

