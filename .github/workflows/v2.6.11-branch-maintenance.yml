      catch(err){setPianoInputIntent('screen');if($('pianoGameMic'))$('pianoGameMic').textContent='🎙 Mic';this.inputNotice='microphone unavailable';this.renderInputState();this.feedback('Microphone unavailable — using screen keys');}
