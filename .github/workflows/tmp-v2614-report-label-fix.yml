name: Temporary v2.6.14 report label test fix

on:
  push:
    branches:
      - release/v2.6.14-child-self-guided-hardware-tests

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.6.14-child-self-guided-hardware-tests
      - name: Align report label assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('browser-tests/app-smoke.spec.js')
          s=p.read_text()
          old="expect(projectText).toContain('Guitar: COMPLETE · 6/6 open strings passed · retries 1');"
          new="expect(projectText).toContain('Guitar microphone: COMPLETE · 6/6 open strings passed · retries 1');"
          if old not in s:
              raise SystemExit('stale Guitar report assertion not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/tmp-v2614-report-label-fix.yml
          git config user.name "81chev8tte-maker"
          git config user.email "81chev8tte@gmail.com"
          git add -A
          git commit -m "test: align Guitar report label with microphone evidence"
          git push origin HEAD:release/v2.6.14-child-self-guided-hardware-tests
