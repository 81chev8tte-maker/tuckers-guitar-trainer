name: v2.6.5 readability upgrade
on:
  push:
    branches: [feature/guitar-readability-v2.6.5]
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate and apply v2.6.5 readability patch
        run: |
          node --check scripts/v265-readability.cjs
          node scripts/v265-readability.cjs
          sed -i 's#./sw.js?v=2.6.4#./sw.js?v=2.6.5#g' app.js
          sed -i "s/'E STRING · OPEN'/'D 5  ·  A 3  ·  E OPEN'/" browser-tests/app-smoke.spec.js
          sed -i "s/'E string · OPEN'/'D 5 · A 3 · E OPEN'/" browser-tests/app-smoke.spec.js
          git diff --check
          grep -q "const APP_VERSION = '2.6.5'" app.js
          grep -q "./sw.js?v=2.6.5" app.js
          grep -q '"version": "2.6.5"' package.json
          grep -q 'family-music-quest-v2.6.5' sw.js
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Commit validated implementation
        run: |
          rm scripts/v265-readability.cjs .github/workflows/v265-readability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: simplify Guitar Highway readability v2.6.5"
          git push