name: Temporary v2.6.13 parent transfer implementation
on:
  push:
    branches: [release/v2.6.13-parent-report-transfer]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.6.13-parent-report-transfer
      - name: Implement focused parent transfer release
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Narrow report-sharing implementation.
          path=Path('guided-hardware-acceptance.js')
          text=path.read_text()
          pattern=r"  async function shareTestReport\(\) \{.*?\n  \}\n  function wireReport\(\) \{"
          replacement=r'''  function buildParentShareFiles(payload, reportText) {
    if (typeof File === 'undefined') return { jsonFile:null, textFile:null, textFilename:null };
    const jsonFile = new File([payload.json], payload.filename, { type:'application/json' });
    const textFilename = payload.filename.replace(/\.json$/i, '-parent-report.txt');
    const companionText = `${reportText}\n\n--- STRUCTURED HARDWARE VALIDATION JSON ---\n${payload.json}`;
    const textFile = new File([companionText], textFilename, { type:'text/plain' });
    return { jsonFile, textFile, textFilename };
  }
  function canShareFileSet(files) {
    if (!navigator.canShare || !files?.length || files.some(file=>!file)) return false;
    try { return Boolean(navigator.canShare({ files })); } catch { return false; }
  }
  async function shareTestReport() {
    const payload = createReportPayload(combinedReportObject());
    const reportText = projectReportText(payload.report);
    const { jsonFile, textFile } = buildParentShareFiles(payload, reportText);
    const title = 'Family Music Quest hardware test report';
    let method = null;
    let files = [];

    if (jsonFile && textFile && canShareFileSet([jsonFile, textFile])) {
      method = 'json+text-files';
      files = [jsonFile, textFile];
    } else if (jsonFile && canShareFileSet([jsonFile])) {
      method = 'json-file';
      files = [jsonFile];
    } else if (textFile && canShareFileSet([textFile])) {
      method = 'text-file';
      files = [textFile];
    } else if (navigator.share) {
      let textShareable = true;
      if (navigator.canShare) {
        try { textShareable = Boolean(navigator.canShare({ title, text:reportText })); } catch { textShareable = false; }
      }
      if (textShareable) method = 'text-only';
    }

    if (!navigator.share || !method) {
      downloadReportPayload(payload);
      setReportActionStatus('This Chromebook cannot open a compatible native share. The JSON report was downloaded; Copy Project Report is also available.');
      return { status:'downloaded', method:'download-json', payload };
    }

    const shareData = { title, text:reportText };
    if (files.length) shareData.files = files;
    try {
      await navigator.share(shareData);
      if (method === 'json+text-files') setReportActionStatus('Share sheet completed with the readable report and structured JSON attached. FMQ cannot verify whether the selected app sent the message.');
      else if (method === 'json-file') setReportActionStatus('Share sheet completed with structured JSON plus the full report text. The selected app may handle the text differently; verify before sending.');
      else if (method === 'text-file') setReportActionStatus('Share sheet completed with a readable report file that also contains the structured JSON. A separate .json attachment was not supported on this device.');
      else setReportActionStatus('Share sheet completed with the full report text. File sharing was unavailable; use Download JSON if the structured file is still needed.');
      return { status:'shared', method, payload };
    } catch (error) {
      if (error?.name === 'AbortError') {
        setReportActionStatus('Sharing was canceled or no destination was selected. Nothing was sent; the report is still saved.');
        return { status:'cancelled', method, payload };
      }
      setReportActionStatus('Sharing did not complete. Nothing was removed; use Send Report to Parent again, Copy Project Report, or Download JSON.');
      return { status:'error', method, payload, error:String(error?.message || error) };
    }
  }
  function wireReport() {'''
          updated,n=re.subn(pattern,replacement,text,flags=re.S)
          if n!=1: raise SystemExit(f'Expected one shareTestReport block, got {n}')
          updated=updated.replace("setReportActionStatus('Could not copy automatically. Select the report text above, or use Share Test Report / Download JSON.');","setReportActionStatus('Could not copy automatically. Select the report text above, or use Send Report to Parent / Download JSON.');")
          updated=updated.replace("const APP_VERSION = '2.6.12';","const APP_VERSION = '2.6.13';")
          path.write_text(updated)

          # Child-facing report action and explanatory copy.
          path=Path('index.html')
          text=path.read_text()
          old='<section class="diagnostic-view" data-diag-view="report" hidden><h2>Hardware Validation Report</h2><p class="muted">Copy the concise Project summary, share the structured JSON through the Chromebook share sheet where supported, or download the same JSON file.</p><pre id="diagReport"></pre><div class="diagnostic-actions"><button id="diagCopyReport" class="button">Copy Project Report</button><button id="diagShareReport" class="button secondary">Share Test Report</button><button id="diagExportReport" class="button secondary">Download JSON</button></div>'
          new='<section class="diagnostic-view" data-diag-view="report" hidden><h2>Hardware Validation Report</h2><p class="muted">Send the readable report and structured evidence through the Chromebook share sheet, or use Copy Project Report / Download JSON as fallbacks.</p><pre id="diagReport"></pre><div class="diagnostic-actions"><button id="diagShareReport" class="button">Send Report to Parent</button><button id="diagCopyReport" class="button secondary">Copy Project Report</button><button id="diagExportReport" class="button secondary">Download JSON</button></div>'
          if old not in text: raise SystemExit('Report action markup target not found')
          path.write_text(text.replace(old,new,1).replace('2.6.12','2.6.13'))

          # Release/version alignment.
          for name in ['app.js','guided-hardware-acceptance.test.js','browser-tests/app-smoke.spec.js','pwa-assets.test.js','sw.js']:
            p=Path(name); t=p.read_text(); u=t.replace('2.6.12','2.6.13')
            if u==t: raise SystemExit(f'Expected v2.6.12 in {name}')
            p.write_text(u)

          for name in ['package.json','package-lock.json']:
            p=Path(name); t=p.read_text(); u=t.replace('"version": "2.6.12"','"version": "2.6.13"')
            if u==t: raise SystemExit(f'Expected package version in {name}')
            p.write_text(u)

          # Browser share-path regression coverage: rename action, verify preferred bundle,
          # narrower file fallback, no-share download, cancellation/error persistence.
          path=Path('browser-tests/app-smoke.spec.js')
          text=path.read_text()
          text=text.replace("await expect(page.getByRole('button',{name:'Share Test Report'})).toBeVisible();","await expect(page.getByRole('button',{name:'Send Report to Parent'})).toBeVisible();")
          old=r'''  await page.evaluate(()=>{
    window.__downloadClicks=0;
    window.__downloadJson='';
    const originalCreate=URL.createObjectURL.bind(URL);
    URL.createObjectURL=blob=>{blob.text().then(text=>{window.__downloadJson=text;});return originalCreate(blob);};
    HTMLAnchorElement.prototype.click=function(){window.__downloadClicks++;};
    Object.defineProperty(navigator,'canShare',{configurable:true,value:()=>true});
    Object.defineProperty(navigator,'share',{configurable:true,value:async data=>{window.__sharedFilename=data.files[0].name;window.__sharedJson=await data.files[0].text();}});
  });
  await page.getByRole('button',{name:'Share Test Report'}).click();
  await expect.poll(()=>page.evaluate(()=>window.__sharedJson||'')).toContain(sessionId);
  const shared=await page.evaluate(()=>JSON.parse(window.__sharedJson));
  expect(shared.guidedAcceptance.sessionId).toBe(sessionId);
  expect(shared.guidedAcceptance.humanEvidence.childScoringTrust).toBe('mostly');
  expect(await page.evaluate(()=>window.__downloadClicks)).toBe(0);

  await page.evaluate(()=>{
    window.__downloadClicks=0;window.__downloadJson='';
    Object.defineProperty(navigator,'canShare',{configurable:true,value:()=>false});
  });
  await page.getByRole('button',{name:'Share Test Report'}).click();
  await expect(page.locator('#diagReportActionStatus')).toContainText('downloaded instead');
  await expect.poll(()=>page.evaluate(()=>window.__downloadClicks)).toBe(1);
  await expect.poll(()=>page.evaluate(()=>window.__downloadJson||'')).toContain(sessionId);
  const fallback=await page.evaluate(()=>JSON.parse(window.__downloadJson));
  expect(fallback.guidedAcceptance).toEqual(shared.guidedAcceptance);

  await page.evaluate(()=>{
    window.__downloadClicks=0;
    Object.defineProperty(navigator,'canShare',{configurable:true,value:()=>true});
    Object.defineProperty(navigator,'share',{configurable:true,value:async()=>{throw new DOMException('cancelled','AbortError');}});
  });
  await page.getByRole('button',{name:'Share Test Report'}).click();
  await expect(page.locator('#diagReportActionStatus')).toContainText('Sharing was canceled');
  expect(await page.evaluate(()=>window.__downloadClicks)).toBe(0);
  expect((await page.evaluate(()=>window.FMQGuidedHardwareTest.getSession())).sessionId).toBe(sessionId);

  await page.evaluate(()=>{
    window.__downloadClicks=0;
    Object.defineProperty(navigator,'share',{configurable:true,value:async()=>{throw new Error('share failed');}});
  });
  await page.getByRole('button',{name:'Share Test Report'}).click();
  await expect(page.locator('#diagReportActionStatus')).toContainText('still saved');
  expect(await page.evaluate(()=>window.__downloadClicks)).toBe(0);
'''
          new=r'''  await page.evaluate(()=>{
    window.__downloadClicks=0;
    window.__downloadJson='';
    window.__canShareCalls=[];
    window.__sharedData=null;
    const originalCreate=URL.createObjectURL.bind(URL);
    URL.createObjectURL=blob=>{blob.text().then(text=>{window.__downloadJson=text;});return originalCreate(blob);};
    HTMLAnchorElement.prototype.click=function(){window.__downloadClicks++;};
    Object.defineProperty(navigator,'canShare',{configurable:true,value:data=>{window.__canShareCalls.push((data.files||[]).map(file=>file.name));return Boolean(data.files?.length===2);}});
    Object.defineProperty(navigator,'share',{configurable:true,value:async data=>{window.__sharedData={title:data.title,text:data.text,files:await Promise.all((data.files||[]).map(async file=>({name:file.name,type:file.type,text:await file.text()})))};}});
  });
  await page.getByRole('button',{name:'Send Report to Parent'}).click();
  const sharedData=await page.evaluate(()=>window.__sharedData);
  expect(sharedData.files).toHaveLength(2);
  expect(sharedData.files[0].name).toMatch(/\.json$/);
  expect(sharedData.files[1].name).toMatch(/-parent-report\.txt$/);
  expect(sharedData.text).toContain('Family Music Quest — Project Hardware Report');
  expect(sharedData.text).toContain(sessionId);
  expect(sharedData.files[1].text).toContain('STRUCTURED HARDWARE VALIDATION JSON');
  expect(sharedData.files[1].text).toContain(sessionId);
  const shared=JSON.parse(sharedData.files[0].text);
  expect(shared.guidedAcceptance.sessionId).toBe(sessionId);
  expect(shared.guidedAcceptance.humanEvidence.childScoringTrust).toBe('mostly');
  expect(await page.evaluate(()=>window.__downloadClicks)).toBe(0);
  expect((await page.evaluate(()=>window.__canShareCalls))[0]).toHaveLength(2);

  await page.evaluate(()=>{
    window.__sharedData=null;window.__canShareCalls=[];
    Object.defineProperty(navigator,'canShare',{configurable:true,value:data=>{const names=(data.files||[]).map(file=>file.name);window.__canShareCalls.push(names);return names.length===1&&names[0].endsWith('-parent-report.txt');}});
    Object.defineProperty(navigator,'share',{configurable:true,value:async data=>{window.__sharedData={text:data.text,files:await Promise.all((data.files||[]).map(async file=>({name:file.name,text:await file.text()})))};}});
  });
  await page.getByRole('button',{name:'Send Report to Parent'}).click();
  const textFallback=await page.evaluate(()=>window.__sharedData);
  expect(textFallback.files).toHaveLength(1);
  expect(textFallback.files[0].name).toMatch(/-parent-report\.txt$/);
  expect(textFallback.files[0].text).toContain('STRUCTURED HARDWARE VALIDATION JSON');
  expect(textFallback.files[0].text).toContain(sessionId);

  await page.evaluate(()=>{
    window.__downloadClicks=0;window.__downloadJson='';
    Object.defineProperty(navigator,'canShare',{configurable:true,value:()=>false});
    Object.defineProperty(navigator,'share',{configurable:true,value:undefined});
  });
  await page.getByRole('button',{name:'Send Report to Parent'}).click();
  await expect(page.locator('#diagReportActionStatus')).toContainText('JSON report was downloaded');
  await expect.poll(()=>page.evaluate(()=>window.__downloadClicks)).toBe(1);
  await expect.poll(()=>page.evaluate(()=>window.__downloadJson||'')).toContain(sessionId);
  const fallback=await page.evaluate(()=>JSON.parse(window.__downloadJson));
  expect(fallback.guidedAcceptance).toEqual(shared.guidedAcceptance);

  await page.evaluate(()=>{
    window.__downloadClicks=0;
    Object.defineProperty(navigator,'canShare',{configurable:true,value:data=>Boolean(data.files?.length===2)});
    Object.defineProperty(navigator,'share',{configurable:true,value:async()=>{throw new DOMException('cancelled','AbortError');}});
  });
  await page.getByRole('button',{name:'Send Report to Parent'}).click();
  await expect(page.locator('#diagReportActionStatus')).toContainText('Nothing was sent');
  expect(await page.evaluate(()=>window.__downloadClicks)).toBe(0);
  expect((await page.evaluate(()=>window.FMQGuidedHardwareTest.getSession())).sessionId).toBe(sessionId);

  await page.evaluate(()=>{
    window.__downloadClicks=0;
    Object.defineProperty(navigator,'share',{configurable:true,value:async()=>{throw new Error('share failed');}});
  });
  await page.getByRole('button',{name:'Send Report to Parent'}).click();
  await expect(page.locator('#diagReportActionStatus')).toContainText('Nothing was removed');
  expect(await page.evaluate(()=>window.__downloadClicks)).toBe(0);
'''
          if old not in text: raise SystemExit('Existing browser share block not found')
          path.write_text(text.replace(old,new,1))

          # Permanent docs, narrowly scoped.
          path=Path('CHANGELOG.md'); text=path.read_text(); marker='# Changelog\n\n'
          section='''## v2.6.13 — Child-Friendly Parent Report Transfer\n\n- Replaced the technical `Share Test Report` action with a child-readable `Send Report to Parent` flow using the native Web Share API.\n- Preferred payload shares the existing structured Hardware Validation JSON plus a readable text companion; the full Project Report is also supplied as share text.\n- The text companion includes the structured JSON after the readable report so evidence remains recoverable when a platform cannot attach the `.json` file separately.\n- Added capability-based narrower native-share fallbacks, neutral cancellation/error handling, and preserved Copy Project Report / Download JSON fallbacks.\n- Split manual-evidence fidelity to #34 rather than widening this release. Native ChromeOS/Gmail behavior still requires physical Dell Chromebook verification.\n\n'''
          if '## v2.6.13 — Child-Friendly Parent Report Transfer' not in text:
            if marker not in text: raise SystemExit('CHANGELOG marker missing')
            path.write_text(text.replace(marker,marker+section,1))

          path=Path('ROADMAP.md'); text=path.read_text()
          old='Issue #30 is the focused v2.6.12 Active Practice Screen Wake Lock maintenance release, authorized as a testing-enabler while #29 still awaits physical evidence. After technical merge/deploy it remains subject to real Dell Chromebook wake-lock acceptance. Issue #24 remains a separate, non-blocking Backlog reporting issue about distinguishing an enumerated virtual/system MIDI endpoint from a verified playable keyboard. Issue #31 tracks child-friendly report transfer/evidence-fidelity work; its parent-transfer portion may follow only after v2.6.12 is technically complete. Neither #24 nor Bass work is included in this maintenance sequence.'
          new='Issue #30 shipped technically in v2.6.12 and remains subject to real Dell Chromebook wake-lock acceptance. Issue #31 is the focused v2.6.13 child-friendly parent-report-transfer maintenance release and likewise requires physical ChromeOS/Gmail verification after deployment. Its separate manual-evidence-fidelity concern is tracked in Backlog Issue #34. Issue #24 remains a separate, non-blocking Backlog reporting issue about distinguishing an enumerated virtual/system MIDI endpoint from a verified playable keyboard. Neither #24/#34 nor Bass work is included in this maintenance sequence.'
          if old not in text: raise SystemExit('ROADMAP current maintenance paragraph missing')
          path.write_text(text.replace(old,new,1))

          path=Path('HARDWARE_VALIDATION.md'); text=path.read_text()
          old='5. open Report and use **Copy Project Report** for the Project Manager chat;\n6. use **Share Test Report** to invoke the native file share sheet when supported, or **Download JSON** as the local fallback;\n7. move the JSON to the Android phone and attach it to the Family Music Quest Project for technical analysis.'
          new='5. open Report and prefer **Send Report to Parent**; choose the intended native share target such as Gmail and confirm the prepared report/attachments before sending;\n6. verify the recipient receives an understandable report plus structured evidence through the real Chromebook share path;\n7. if native sharing is unavailable or a target does not preserve the prepared evidence, use **Copy Project Report** and **Download JSON** as local fallbacks.'
          if old not in text: raise SystemExit('HARDWARE_VALIDATION transfer steps missing')
          text=text.replace(old,new,1)
          text=text.replace('Share Test Report and Download JSON serialize the same structured Hardware Validation report object. Native share destinations are selected by ChromeOS; FMQ does not promise a particular target such as Quick Share and does not upload the report itself.','Send Report to Parent and Download JSON use the same structured Hardware Validation report object. The parent-transfer action also prepares the full human-readable Project Report and, where supported, a readable text companion. Native share destinations and target-specific handling are controlled by ChromeOS/the selected app; FMQ does not promise Gmail or any other target will preserve every share field until that path is physically verified, and FMQ does not upload or send the report itself.')
          path.write_text(text)

          # Remove temporary workflow before commit.
          Path('.github/workflows/release-parent-transfer-v2613.yml').unlink()
          PY
          git diff --check
      - name: Commit v2.6.13 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v2.6.13: child-friendly parent report transfer"
          git push
