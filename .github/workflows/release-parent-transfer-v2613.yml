name: Temporary v2.6.13 parent transfer implementation
on:
  push:
    branches: [release/v2.6.13-parent-report-transfer]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.6.13-parent-report-transfer
      - name: Apply focused v2.6.13 edits
        run: python scripts/tmp_v2613_parent_transfer.py
      - name: Verify staged diff
        run: git diff --check
      - name: Remove temporary helpers and commit
        run: |
          rm scripts/tmp_v2613_parent_transfer.py
          rm .github/workflows/release-parent-transfer-v2613.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v2.6.13: child-friendly parent report transfer"
          git push
