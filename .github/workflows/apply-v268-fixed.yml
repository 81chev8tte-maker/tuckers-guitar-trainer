name: Apply v2.6.8 Hardware Report Sharing (fixed)
on:
  push:
    branches: [feature/hardware-report-sharing-v2.6.8]
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, 'feat: hardware report sharing v2.6.8') }}"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-report-sharing-v2.6.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Recover and apply focused v2.6.8 patch
        run: |
          mkdir -p .tmp
          python - <<'PY'
          import base64, gzip, pathlib, re
          source = pathlib.Path('.github/workflows/apply-v268.yml').read_text()
          match = re.search(r"echo '([^']+)' \| base64", source)
          if not match:
              raise SystemExit('Could not recover staged v2.6.8 patch payload')
          payload = gzip.decompress(base64.b64decode(match.group(1))).decode()
          old = "new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new = "new_text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if old not in payload:
              raise SystemExit('Expected patcher regex helper was not found')
          payload = payload.replace(old, new, 1)
          pathlib.Path('.tmp/apply-v268.py').write_text(payload)
          PY
          python .tmp/apply-v268.py
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: git diff --check
      - name: Commit validated implementation
        run: |
          rm -rf .tmp
          rm -f .github/workflows/apply-v268.yml .github/workflows/apply-v268-fixed.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: hardware report sharing v2.6.8'
          git push
