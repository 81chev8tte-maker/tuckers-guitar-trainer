name: Temporary v2.6.13 CI test fix
on:
  push:
    branches: [release/v2.6.13-parent-report-transfer]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.6.13-parent-report-transfer
      - name: Apply focused Playwright timing fix
        run: python tools/tmp-fix-v2613-share-test.py
      - name: Commit focused test fix and remove temporary helper
        run: |
          rm tools/tmp-fix-v2613-share-test.py .github/workflows/tmp-v2613-ci-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: wait for async parent-share mock payloads"
          git push origin HEAD:release/v2.6.13-parent-report-transfer
