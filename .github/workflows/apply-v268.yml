name: Apply v2.6.8 Hardware Report Sharing
on:
  push:
    branches: [feature/hardware-report-sharing-v2.6.8]
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'feat: hardware report sharing v2.6.8') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardware-report-sharing-v2.6.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused v2.6.8 patch
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply-v268.py
          python /tmp/apply-v268.py
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: git diff --check
      - name: Commit validated implementation
        run: |
          rm -f .github/workflows/apply-v268.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: hardware report sharing v2.6.8'
          git push
