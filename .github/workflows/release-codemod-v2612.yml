name: Temporary v2.6.12 release alignment
on:
  push:
    branches: [release/v2.6.12-wake-lock]
permissions:
  contents: write
jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.6.12-wake-lock
      - name: Align release version references
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              'index.html',
              'app.js',
              'guided-hardware-acceptance.js',
              'guided-hardware-acceptance.test.js',
              'browser-tests/app-smoke.spec.js',
          ]
          for name in paths:
              path = Path(name)
              text = path.read_text()
              updated = text.replace('2.6.11', '2.6.12')
              if updated == text:
                  raise SystemExit(f'Expected v2.6.11 reference not found in {name}')
              path.write_text(updated)
          PY
          git diff --check
      - name: Commit release alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html app.js guided-hardware-acceptance.js guided-hardware-acceptance.test.js browser-tests/app-smoke.spec.js
          git commit -m "chore: align v2.6.12 release version"
          git push
